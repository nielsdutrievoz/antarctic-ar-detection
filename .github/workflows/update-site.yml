name: Cartes synoptiques

on:
  schedule:
    # Toutes les 6 h ; le script prend le dernier run HRES 00/12 UTC complet.
    - cron: "30 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]       # republie le site à chaque modification du dépôt

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Cache des traits de côte (Natural Earth)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v1

      - name: Générer les cartes
        shell: bash -el {0}
        run: python -u synoptic_maps.py

      # Alertes aux abonnés (inscriptions Supabase). Sans les secrets, l'étape ne fait rien ;
      # un échec n'empêche pas la mise à jour du site.
      - name: Alertes par e-mail
        continue-on-error: true
        shell: bash -el {0}
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SMTP_PASSWORD" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Secrets SMTP_PASSWORD / SUPABASE_SECRET_KEY absents : pas d'alertes."; exit 0
          fi
          python -u alert_mail.py alerts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
