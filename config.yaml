# Configuration du système d'alerte AR (rivières atmosphériques) en Antarctique.
# Chemins relatifs = relatifs au dossier de ce fichier.

# --- Sites surveillés ---------------------------------------------------------
# Ajoute autant de sites que tu veux. radius_km = 0 -> point de grille le plus proche ;
# sinon, un AR est compté si un pixel AR tombe à moins de radius_km du site.
sites:
  - name: Dumont d'Urville
    lat: -66.66
    lon: 140.00
    radius_km: 100
  - name: Concordia
    lat: -75.10
    lon: 123.35
    radius_km: 100
  - name: Neumayer III
    lat: -70.67
    lon: -8.27
    radius_km: 100

# --- Détection (Wille et al., algorithme v2.4 Antarctique) --------------------
detection:
  # vivt : Wille et al. 2021 (q, v sur 8 niveaux + sp : ~6 Mo par membre et par échéance)
  # iwv  : Wille et al. 2019 (colonne d'eau totale : ~0.4 Mo par membre et par échéance)
  variable: vivt
  grid_res: 0.5          # degrés ; grille commune climatologie / prévision
  lat_north: -37.5       # domaine de détection de Wille v2.4
  lat_south: -85.0
  percentile: 98         # seuil climatologique mensuel local
  min_lat_extent: 20.0   # extension méridienne minimale de la forme AR (degrés)

# --- Climatologie ERA5 (calculée une seule fois, pour la variable choisie) ------
climatology:
  first_year: 1991
  last_year: 2020
  hours: ["00:00", "06:00", "12:00", "18:00"]
  download_dir: data/era5            # ~6 Go à 0.5° pour 30 ans (supprimable une fois les seuils calculés)
  output: data/thresholds_vivt.nc    # seuils 98e percentile, 12 mois (un fichier par variable)
  output_iwv: data/thresholds_iwv.nc # seuils IWV (Wille et al. 2019)
  output_dark: data/thresholds_dark.nc # seuils DARK (Buffet et al. 2026), voir build_climatology_dark.py

# --- Prévision ECMWF ENS (open data) ------------------------------------------
forecast:
  source: ecmwf          # ecmwf | aws | azure | google (mêmes fichiers ; aws limite souvent le débit)
  max_step_h: 120        # horizon de prévision (h)
  step_interval_h: 6     # pas de temps (h), multiple de 3 jusqu'à 144 h, de 6 au-delà
  levels: [1000, 925, 850, 700, 600, 500, 400, 300]   # hPa, pour intégrer le vIVT
  download_workers: 8    # téléchargements HTTP en parallèle
  work_dir: data/forecast

# --- Alerte -------------------------------------------------------------------
alert:
  probability_threshold: 0.20   # alerte si >= 20 % des membres voient une AR au site
  min_consecutive_steps: 1      # nombre minimal de pas consécutifs au-dessus du seuil
  # Après une première alerte, renvoyer un email seulement si la probabilité max
  # augmente d'au moins cette valeur (évite un email à chaque run).
  update_if_prob_increase: 0.20
  state_file: data/state.json

email:
  enabled: true
  smtp_host: smtp.example.org   # à remplir (serveur SMTP de ton institut)
  smtp_port: 587
  starttls: true
  username: ""                  # vide = pas d'authentification
  # Le mot de passe n'est jamais écrit ici. Il est lu dans la variable
  # d'environnement AR_SMTP_PASSWORD, sinon dans le trousseau macOS
  # (service "ar-alert-smtp", voir README).
  from: ""
  to: []                        # liste de destinataires

# --- Alertes par e-mail des abonnés du site (alert_mail.py) --------------------
# Les secrets ne sont jamais écrits ici : SMTP_PASSWORD (jeton SMTP Proton) et
# SUPABASE_SECRET_KEY sont lus dans les variables d'environnement (secrets GitHub).
alert_mail:
  supabase_url: https://fdbiyqlglprakjyrhfzh.supabase.co
  site_url: https://nielsdutrievoz.github.io/antarctic-ar-detection/
  smtp_host: smtp.protonmail.ch
  smtp_port: 587
  sender: niels@dutrievoz.eu
  sender_name:
    fr: Alertes AR Antarctique
    en: Antarctic AR alerts
  radius_km: 100          # AR signalée à moins de cette distance du lieu
  new_event_gap_h: 24     # une AR prévue plus de 24 h après la dernière signalée = nouvelle AR
  remind_h: 24            # rappel optionnel : envoyé quand l'arrivée est à moins de 24 h
  gif_width: 480
  gif_margin_h: 24        # animation : de l'arrivée − 24 h à la fin + 24 h

# --- Site web (cartes synoptiques ECMWF HRES, synoptic_maps.py) ---------------
site:
  source: ecmwf          # serveur de données (voir forecast.source)
  max_step_h: 120        # horizon des cartes (h)
  step_interval_h: 6
  plot_lat_north: -30.0  # bord nord de la carte polaire
  data_lat_north: -15.0  # bord nord des données (domaine de DARK : 15–90°S)
  output_dir: site       # dossier publié sur GitHub Pages
  dpi: 150               # 8 x 8.6 pouces -> 1200 x 1290 px
  quiver_every: 8        # un vecteur IVT tous les N points de grille
  render_workers: 4

# --- Événements passés (events.py, réanalyse ERA5) ----------------------------
events:
  - id: 2018-12-concordia
    start: 2018-12-16
    end: 2018-12-24
    title:
      fr: "Décembre 2018"
      en: "December 2018"
    description:
      fr: "Rivière atmosphérique d'origine atlantique, arrivée sur la Terre de Coats (ouest de la Terre de la Reine-Maud) le 17 décembre, puis traversée du plateau jusqu'à Concordia du 19 au 23 décembre. Le 21 décembre, la température à Concordia a atteint −14,7 °C, la deuxième plus élevée depuis 2005. Les trois algorithmes détectent l'AR à son arrivée sur la Terre de Coats, près de Neumayer III (17–19 décembre). Sur le plateau, seul DARK la suit jusqu'à Concordia (20–23 décembre) : la vapeur d'eau y est pourtant anormale (IWV deux fois supérieur au seuil le 21 décembre), mais la zone ne couvre qu'environ 12° de latitude, sous le critère de 20° des méthodes de Wille, et le transport y est orienté vers le nord, ce que vIVT ignore."
      en: "Atlantic-sourced atmospheric river that made landfall over Coats Land (western Dronning Maud Land) on 17 December, then crossed the plateau to Concordia from 19 to 23 December. On 21 December the temperature at Concordia reached −14.7 °C, the second highest since 2005. All three algorithms detect the AR at landfall over Coats Land, near Neumayer III (17–19 December). Over the plateau only DARK tracks it to Concordia (20–23 December): water vapour there is clearly anomalous (IWV twice the threshold on 21 December), but the moist area spans only about 12° of latitude, below the 20° criterion of the Wille methods, and the transport points northward, which vIVT ignores."
    reference:
      text: "Dutrievoz et al. (2026), The Cryosphere 20, 1025–1046"
      url: "https://doi.org/10.5194/tc-20-1025-2026"
  - id: 2022-02-peninsula
    start: 2022-02-04
    end: 2022-02-11
    title:
      fr: "Février 2022"
      en: "February 2022"
    description:
      fr: "Rivière atmosphérique intense guidée vers la Péninsule antarctique par une dépression de la mer d'Amundsen anormale et un anticyclone record à l'est de la Péninsule. Les 7 et 8 février 2022, records absolus de température à King Sejong (13,7 °C), Carlini (13,6 °C), Vernadsky (12,7 °C) et Palmer (11,6 °C), avec une fonte de surface record."
      en: "Intense atmospheric river steered towards the Antarctic Peninsula by an anomalous Amundsen Sea Low and a record-breaking high-pressure system east of the Peninsula. On 7–8 February 2022, all-time temperature records at King Sejong (13.7 °C), Carlini (13.6 °C), Vernadsky (12.7 °C) and Palmer (11.6 °C), with record surface melt."
    reference:
      text: "Gorodetskaya et al. (2023), npj Climate and Atmospheric Science 6, 202"
      url: "https://doi.org/10.1038/s41612-023-00529-6"
  - id: 2022-03-east-antarctica
    start: 2022-03-13
    end: 2022-03-21
    title:
      fr: "Mars 2022"
      en: "March 2022"
    description:
      fr: "Rivière atmosphérique issue du secteur de l'océan Indien (15–19 mars 2022), à l'origine de la vague de chaleur record sur le plateau de l'Antarctique de l'Est, avec des températures exceptionnelles à Concordia le 18 mars."
      en: "Atmospheric river from the Indian Ocean sector (15–19 March 2022) that drove the record-breaking heatwave over the East Antarctic plateau, with exceptional temperatures at Concordia on 18 March."
    reference:
      text: "Wille et al. (2024), Journal of Climate 37, 757–778"
      url: "https://doi.org/10.1175/JCLI-D-23-0175.1"
